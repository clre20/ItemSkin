  reload: "重新載入設定與外觀，並重建材質包"
  version: "查看版本並檢查更新"

check:
  header: "&d手上物品外觀"
  empty-hand: "&c請先把物品拿在主手上"
  skin: " &7外觀：&f{skin} &8({type})"
  skin-none: " &7外觀：&8沒有 ItemSkin 外觀"
