  pack-item-ok: "&7放入的物品：&a外觀 {skin} 在材質包中"
  pack-item-missing: "&7放入的物品：&c外觀 {skin} 已不在材質包中"
  close:
    name: "&c關閉"
    lore:
      - "&7物品會還給你"
  skin:
    name: "&f{skin}"
    lore:
