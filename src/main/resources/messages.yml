  status-loaded: "&a已載入最新版本"
  status-outdated: "&e已載入舊版本，需要重新接收"
  status-pending: "&e已發送，等待用戶端回應"
  status-accepted: "&e已接受，下載中"
  status-downloaded: "&e已下載，載入中"
  status-declined: "&c你拒絕了材質包"
